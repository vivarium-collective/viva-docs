name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  # Daily safety net: rebuild once a day so the catalog is never more than ~24h
  # stale even if the event trigger below misfires.
  schedule:
    - cron: "17 7 * * *"
  # Fired when the marketplace ledger changes, so the committed fallback snapshot
  # refreshes within minutes of a real change. (The catalog page itself is live —
  # it fetches the ledger at load time — so this only keeps the offline fallback
  # current.)
  repository_dispatch:
    types: [catalog-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "mkdocs-material>=9.5" "pymdown-extensions>=10.7" playwright pypdf
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Refresh catalog fallback snapshot from the marketplace ledger
        # The catalog page is live (it fetches the viva-catalog ecosystem index at
        # load time). This step only refreshes the committed fallback snapshot
        # docs/catalog-data.json so offline builds / a gh-pages hiccup still render.
        # Non-fatal: if the fetch fails, the previously committed snapshot is used.
        run: |
          set -uo pipefail
          if python scripts/snapshot_catalog.py; then
            echo "Catalog fallback snapshot refreshed from the marketplace ledger"
          else
            echo "::warning::Could not refresh snapshot; using committed docs/catalog-data.json"
          fi
      - name: Build site
        run: mkdocs build --strict
      - name: Build PDF (headless Chromium render)
        run: python scripts/build_pdf.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
